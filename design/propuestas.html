<title>Propuestas App de Pareja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* ---------- Demo bar + page tokens ---------- */
:root{--page:#E9EAEE;--bar:#FFFFFF;--bar-ink:#1B1D27;--bar-muted:#6A6E7E;--bar-line:#D9DBE3;--bar-on:#1B1D27;--bar-on-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0B0C10;--bar:#14161C;--bar-ink:#ECEDF2;--bar-muted:#9497A6;--bar-line:#2A2D37;--bar-on:#ECEDF2;--bar-on-ink:#14161C}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0B0C10;--bar:#14161C;--bar-ink:#ECEDF2;--bar-muted:#9497A6;--bar-line:#2A2D37;--bar-on:#ECEDF2;--bar-on-ink:#14161C}
*{box-sizing:border-box}
body{background:var(--page);color:var(--bar-ink);font-family:"Manrope",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent,#0C8F8C);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.demobar{position:relative;z-index:50;background:var(--bar);border-bottom:1px solid var(--bar-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.demobar .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bar-muted);font-weight:700}
.demobar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--bar-line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--bar-muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bar-on);color:var(--bar-on-ink)}
.demobar .linkbtn{border:1px solid var(--bar-line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.demobar .note{margin-left:auto;font-size:12px;color:var(--bar-muted)}
@media(max-width:860px){.demobar .note{display:none}}

/* ---------- App tokens (Ruta) ---------- */
.app{
  --bg:#F1F4FA;--surface:#FFFFFF;--surface2:#E8EDF7;--ink:#0E1A3A;--muted:#58658A;--line:#DEE4F0;
  --accent:#0C8F8C;--accent-ink:#FFFFFF;--accent-soft:#DDF3F1;--hi:#E8A21E;
  --ok:#0C8F8C;--ok-soft:#DDF3F1;--warn:#B76A06;--warn-soft:#FCEFD8;--crit:#C23A4E;--crit-soft:#FAE3E7;
  --side:#0E1A3A;--side-ink:#E6ECFA;--side-muted:#8E9AC0;--side-active:#1C2B57;--side-active-ink:#5FE0D4;--side-line:#1F2D57;
  --w-emilia:#7A5AF8;--w-psico:#0C8F8C;--w-diego:#E0662E;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;
  --rad:20px;--rad-s:12px;--shadow:0 1px 2px rgba(14,26,58,.05),0 8px 24px -12px rgba(14,26,58,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .app{color-scheme:dark;--bg:#071027;--surface:#0F1B3B;--surface2:#16244A;--ink:#E8EEFF;--muted:#93A0C6;--line:#21305C;--accent:#43D3C7;--accent-ink:#071027;--accent-soft:#103A44;--hi:#F6C35B;--ok:#43D3C7;--ok-soft:#103A44;--warn:#F6C35B;--warn-soft:#3A2D10;--crit:#F27A8B;--crit-soft:#3D1A21;--side:#050C1F;--side-active:#13224A;--side-line:#15224A;--w-emilia:#A78BFA;--w-psico:#43D3C7;--w-diego:#F59E6B;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"] .app{color-scheme:dark;--bg:#071027;--surface:#0F1B3B;--surface2:#16244A;--ink:#E8EEFF;--muted:#93A0C6;--line:#21305C;--accent:#43D3C7;--accent-ink:#071027;--accent-soft:#103A44;--hi:#F6C35B;--ok:#43D3C7;--ok-soft:#103A44;--warn:#F6C35B;--warn-soft:#3A2D10;--crit:#F27A8B;--crit-soft:#3D1A21;--side:#050C1F;--side-active:#13224A;--side-line:#15224A;--w-emilia:#A78BFA;--w-psico:#43D3C7;--w-diego:#F59E6B;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}

/* ---------- Shell ---------- */
.app{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--display);font-weight:700;font-size:19px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:#43D3C7;color:#071027;display:grid;place-items:center;font-size:13px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--side-muted)}
.navlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:var(--rad-s);color:var(--side-ink);font-weight:500;font-size:14.5px}
.nav:hover{background:var(--side-active)}
.nav[aria-current="page"]{background:var(--side-active);color:var(--side-active-ink);font-weight:700}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:#F6C35B;color:#1A1203;border-radius:999px;padding:1px 7px}
.side .spacer{flex:1}
.main{min-width:0;padding:0 32px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.top .crumb{font-size:13px;color:var(--muted)}
.top .crumb b{color:var(--ink);font-weight:700}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.iconbtn{width:38px;height:38px;border-radius:var(--rad-s);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--crit)}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:none}
.who b{display:block;font-size:13.5px}.who span{font-size:12px;color:var(--muted)}
.content{display:flex;flex-direction:column;gap:22px;flex:1}
.bnav{display:none}
.i{flex:none;vertical-align:middle}
@media(max-width:860px){
  .app{grid-template-columns:1fr}.side{display:none}.main{padding:0 16px 104px}.top .crumb{display:none}.who div{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);border-top:1px solid var(--side-line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav button{border:0;background:transparent;color:var(--side-muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:6px 8px;border-radius:10px}
  .bnav button[aria-current="page"]{color:var(--side-active-ink);background:var(--side-active)}
}

/* ---------- Components ---------- */
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(26px,3.2vw,34px);line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.lead{color:var(--muted);font-size:15.5px;max-width:64ch;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.pair{background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.whochip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--wc);background:color-mix(in srgb,var(--wc) 12%,transparent);padding:3px 10px 3px 4px;border-radius:999px;white-space:nowrap}
.whochip i{width:18px;height:18px;border-radius:50%;background:var(--wc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:10px}
.w-emilia{--wc:var(--w-emilia)}.w-psico{--wc:var(--w-psico)}.w-diego{--wc:var(--w-diego)}.w-team,.w-video{--wc:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media(max-width:1060px){.grid2,.grid2e{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:700}
.li .tx span{font-size:13px;color:var(--muted)}
.li .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.ico{width:38px;height:38px;border-radius:var(--rad-s);display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.ico.info{background:var(--accent-soft);color:var(--accent)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--rad-s);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert .i{color:var(--warn);margin-top:2px}
.alert.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.alert.info .i{color:var(--accent)}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--rad);overflow:hidden;background:radial-gradient(120% 90% at 20% 20%,rgba(67,211,199,.55) 0%,transparent 60%),radial-gradient(100% 80% at 85% 90%,rgba(246,195,91,.45) 0%,transparent 55%),#0E1A3A;display:grid;place-items:center;color:#fff}
.video .play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.video .cap{position:absolute;left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.video .faces{position:absolute;top:16px;left:16px;display:flex}
.video .faces span{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;font-weight:700;margin-right:-8px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:700;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--rad-s);padding:11px 13px;font:inherit}
textarea.input{min-height:92px;resize:vertical}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale span{width:36px;height:36px;border-radius:var(--rad-s);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.scale span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.tags span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs{display:inline-flex;gap:4px;background:var(--surface2);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{border:1.5px dashed var(--line);border-radius:var(--rad);padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rad-s);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--surface2);color:var(--muted)}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.ok .n{background:var(--ok-soft);color:var(--ok)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote{font-family:var(--display);font-size:19px;line-height:1.45;max-width:62ch}
.quote cite{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-top:10px}
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:720px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 12px 10px}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
td b{font-weight:700}
.num{font-variant-numeric:tabular-nums}
.pager{margin-top:28px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:16px 20px;border-radius:var(--rad);background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.pager .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* Hero + camino de 14 pasos */
.hero{border-radius:var(--rad);padding:26px;background:radial-gradient(90% 120% at 100% 0%,rgba(67,211,199,.28),transparent 55%),radial-gradient(70% 90% at 0% 100%,rgba(246,195,91,.18),transparent 55%),#0E1A3A;color:#E8EEFF;display:flex;flex-direction:column;gap:20px}
.hero .eyebrow{color:#8E9AC0}
.hero h1{color:#fff}
.hero .lead{color:#B9C3E2}
.hero .muted{color:#8E9AC0}
.path{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.path .c{height:46px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#8E9AC0;text-align:center;line-height:1.1;padding:0 2px;position:relative;overflow:hidden}
.path .c small{font-size:9.5px;font-weight:600;opacity:.85;white-space:nowrap}
.path .c.d{background:#43D3C7;color:#071027}
.path .c.n{background:#F6C35B;color:#1A1203;height:56px;margin-top:-5px;box-shadow:0 0 0 4px rgba(246,195,91,.18)}
.path .c .wdot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--wc)}
.blocks{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:8px}
.blocks span{border-top:2px solid rgba(255,255,255,.18);padding-top:5px;font-size:12px;font-weight:700;color:#8E9AC0}
.blocks span.on{border-color:#F6C35B;color:#fff}
@media(max-width:700px){.path .c small{display:none}.path .c{font-size:10px;height:40px}.path .c.n{height:48px}.blocks span{font-size:10px}}
.mission{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mission .k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#F6C35B;font-weight:700}
.mission b{font-family:var(--display);font-size:22px;line-height:1.2}
.mission .why{color:#B9C3E2;font-size:14px}
.mission .btn{align-self:flex-start;background:#43D3C7;color:#071027}
.reqs{display:flex;gap:8px;flex-wrap:wrap}
.req{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.req.ok{background:var(--ok-soft);color:var(--ok)}
.req.no{background:var(--warn-soft);color:var(--warn)}
.hero .req{background:rgba(255,255,255,.08);color:#B9C3E2}
.hero .req.ok{background:rgba(67,211,199,.16);color:#5FE0D4}
.hero .req.no{background:rgba(246,195,91,.16);color:#F6C35B}

/* Cuadro de las 4 áreas */
.gantt{display:grid;grid-template-columns:180px minmax(0,1fr);row-gap:12px;min-width:780px}
.gantt .lab{font-weight:700;font-size:13.5px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.gantt .lab span{font-weight:500;font-size:11.5px;color:var(--muted)}
.gantt .lab .chip{align-self:flex-start;font-size:11px;padding:1px 8px}
.gtrack{position:relative;display:grid;grid-template-columns:repeat(18,minmax(0,1fr));align-items:center;min-height:40px;background:var(--surface2);border-radius:10px;padding:0 2px}
.gtrack .t{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--hi);z-index:1}
.gm{height:26px;margin:0 2px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);position:relative;z-index:2;white-space:nowrap}
.gm.d{background:var(--accent);color:var(--accent-ink)}
.gm.n{border-color:var(--hi);background:var(--hi);color:#1A1203}
.gm.w{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.gm.l{border-style:dashed;border-color:color-mix(in srgb,var(--muted) 45%,transparent);color:var(--muted);background:transparent}
.gm.dot{width:13px;height:13px;border-radius:50%;justify-self:center;margin:0}
.gm .wdot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--wc);border:2px solid var(--surface)}
.gmonths{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));font-size:11.5px;color:var(--muted);font-weight:700}
.gmonths span{border-left:1px solid var(--line);padding-left:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--accent)}
.legend i.w{border-radius:50%;border:0;background:var(--wc)}

/* Sesiones / camino */
.sessrow{display:flex;gap:16px;padding:16px;border:1px solid var(--line);border-radius:var(--rad-s);background:var(--bg);align-items:flex-start;flex-wrap:wrap}
.sessrow .n{font-family:var(--display);font-size:22px;font-weight:700;width:44px;color:var(--muted)}
.sessrow.next{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 10%,var(--surface))}
.sessrow.next .n{color:var(--warn)}
.sessrow.done .n{color:var(--accent)}
.sessrow .tx{flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px}
.agendaitems{margin:0;padding-left:18px;color:var(--ink);font-size:13.5px}
.blockhead{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:8px 0 2px}
.vstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;position:relative;padding-bottom:16px}
.vstep::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.vstep:last-child::before{display:none}
.vstep .dotn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface2);color:var(--muted);font-family:var(--display);position:relative;z-index:1}
.vstep.d .dotn{background:var(--accent);color:var(--accent-ink)}
.vstep.d::before{background:var(--accent)}
.vstep.n .dotn{background:var(--hi);color:#1A1203;box-shadow:0 0 0 5px color-mix(in srgb,var(--hi) 25%,transparent)}
.vstep .body{display:flex;flex-direction:column;gap:6px;padding-top:5px}
.vstep .body .top3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:1060px){.split{grid-template-columns:1fr}}
.modlist .li{cursor:pointer;border-radius:var(--rad-s)}
.modlist .li.on .tx b{color:var(--accent)}
.qblock{display:flex;flex-direction:column;gap:20px}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rad-s);background:var(--bg);font-size:13px}
.res .tx{flex:1;min-width:0}
.res b{display:block;font-weight:700;font-size:13.5px}

/* Login */
.login{grid-column:1/-1;min-height:calc(100vh - 52px);display:grid;place-items:center;padding:32px 16px}
.lbox{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1fr;border-radius:var(--rad);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

/* ---------- helpers ---------- */
const D=()=>DATA[S.phase];
const W=()=>WHO[S.who];
const go=s=>`data-go="${s}"`;
const whochip=k=>`<span class="whochip w-${k}"><i>${STAFF[k].ini}</i>${STAFF[k].n}</span>`;
const stepState=(n,d)=>n<d.cur?'d':n===d.cur?'n':'f';
function counts(d){
  const obDone=d.ob.filter(x=>x==='done').length;
  const vids=d.mods.filter(x=>x==='done'||x==='task').length;
  const tasks=d.mods.filter(x=>x==='done').length;
  const sDone=SESS.filter(s=>s.n<d.cur).length;
  return {obDone,vids,tasks,sDone,stepsDone:d.cur-1,pct:Math.round((d.cur-1)/14*100)};
}
function reqList(step,d){
  return step.req.map(r=>{
    if(r==='rad')return {label:'Radiografía Inicial',ok:d.rad};
    if(typeof r==='string')return {label:r,ok:step.n<=d.cur};
    const st=d.mods[r];
    const ok=st==='done';
    const note=st==='task'?' · falta la tarea':'';
    return {label:'Módulo '+r+note,ok,oblig:step.oblig&&step.oblig.includes(r)};
  });
}
const reqChips=(list,cls='')=>`<div class="reqs ${cls}">${list.map(r=>`<span class="req ${r.ok?'ok':'no'}">${ico(r.ok?'check':'lock',13)} ${r.label}${r.oblig?' · obligatorio':''}</span>`).join('')}</div>`;

const statusChip=d=>d.status==='warn'?`<span class="chip warn">${ico('clock',14)} Quedan 2 sesiones</span>`:d.status==='start'?`<span class="chip info">${ico('flag',14)} Paso ${d.cur} de 14</span>`:`<span class="chip ok">${ico('check',14)} Van al día</span>`;

/* ---------- camino (14 pasos) en el hero ---------- */
function pathBar(d){
  const cells=STEPS.map(s=>{
    const st=stepState(s.n,d);
    const lab=s.s?'S'+s.s:s.short;
    const sub=s.s?STAFF[s.who].n:'Paso '+s.n;
    return `<div class="c ${st}" title="Paso ${s.n} · ${s.t}">${s.s?`<span class="wdot w-${s.who}"></span>`:''}${lab}<small>${sub}</small></div>`;
  }).join('');
  let col=1;
  const blocks=BLOCKS.map(([name,span],i)=>{const on=STEPS[d.cur-1].b===i;const x=`<span class="${on?'on':''}" style="grid-column:${col}/span ${span}">${name}</span>`;col+=span;return x}).join('');
  return `<div><div class="path" aria-label="Paso ${d.cur} de 14">${cells}</div><div class="blocks">${blocks}</div>
  <p class="muted small" style="margin-top:10px">Cada casilla es un paso. Para entrar a cada paso hay un requisito. El punto de color indica con quién es la sesión.</p></div>`;
}

/* ---------- cuadro de 4 áreas (semanas) ---------- */
function gantt(d){
  const tpos=`left:calc(${(d.week-.5)/18*100}% - 1px)`;
  const c=counts(d);
  const row=(lab,sub,state,cells)=>`<div class="lab">${lab}<span>${sub}</span>${state}</div><div class="gtrack"><span class="t" style="${tpos}"></span>${cells}</div>`;
  const okc=`<span class="chip ok">${ico('check',12)} Al día</span>`;
  const obDone=d.ob.every(x=>x==='done');
  const ini=`<span class="gm ${obDone?'d':'n'}" style="grid-column:1/2">${obDone?'Listo':'Onboarding'}</span>`;
  const mods=d.mods.map((s,i)=>`<span class="gm ${s==='done'?'d':s==='task'?'w':s==='current'?'n':'l'}" style="grid-column:${M_WEEK[i]}" title="Módulo ${i}">M${i}</span>`).join('');
  const ses=SESS.map((s,i)=>{const st=stepState(s.n,d);return `<span class="gm ${st==='d'?'d':st==='n'?'n':'l'} w-${s.who}" style="grid-column:${S_WEEK[i]}" title="Sesión ${s.s} · ${STAFF[s.who].n}">S${s.s}<span class="wdot"></span></span>`}).join('');
  const gr=G_DATE.map((g,i)=>`<span class="gm dot ${i<d.gDone?'d':i===d.gDone?'n':'l'}" style="grid-column:${(i+1)*2}" title="Coaching grupal ${g}"></span>`).join('');
  let col=1;const months=MONTHS.map(m=>{const x=`<span style="grid-column:${col}/span ${m[1]}">${m[0]}</span>`;col+=m[1];return x}).join('');
  const ns=nextSession(d);const nsReq=ns?reqList(ns,d):[];const nsOk=nsReq.every(r=>r.ok);
  const taskLate=d.mods.indexOf('task');
  return `<div class="scrollx"><div class="gantt">
    <div></div><div class="gmonths">${months}</div>
    ${row('Inicio',`${c.obDone} de 6 pasos de onboarding`,obDone?okc:`<span class="chip info">En curso</span>`,ini)}
    ${row('Módulos',`${c.vids} de 9 vistos`,taskLate>=0?`<span class="chip warn">Falta tarea M${taskLate}</span>`:okc,mods)}
    ${row('Sesiones de Terapia',`${c.sDone} de 10 sesiones`,ns&&!nsOk?`<span class="chip warn">${ico('lock',12)} S${ns.s}: requisito pendiente</span>`:okc,ses)}

      <button class="btn" style="align-self:flex-start">Enviar pregunta</button></section>
  </div>
  ${pager()}`;
}

/* ---------- render ---------- */
const SCREENS={inicio,camino,bienvenida,contrato,radiografia,modulos,terapia,coaching,equipo};
const root=document.getElementById('root');
function render(){
  if(!SCREENS[S.screen]&&S.screen!=='login')S.screen='inicio';
  root.innerHTML=S.screen==='login'?login():shell(SCREENS[S.screen]());
  for(const [id,key] of [['segPh','phase'],['segW','who']])
    document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S[key]));
  save();
}
document.addEventListener('click',e=>{
  const seg=e.target.closest('.seg button');
  if(seg){const k={segPh:'phase',segW:'who'}[seg.parentElement.id];S[k]=seg.dataset.v;S.mod=null;render();return;}
  if(e.target.closest('#toLogin')){S.screen='login';render();window.scrollTo(0,0);return;}
  if(e.target.closest('#toTeam')){S.screen='equipo';render();window.scrollTo(0,0);return;}
  const g=e.target.closest('[data-go]');
  if(g){S.screen=g.dataset.go;S.mod=null;render();window.scrollTo(0,0);return;}
  const m=e.target.closest('[data-mod]');
  if(m){S.mod=+m.dataset.mod;render();return;}
  const t=e.target.closest('[data-tab]');
  if(t){S.taskTab=t.dataset.tab;render();return;}
  const w=e.target.closest('[data-who]');
  if(w){S.who=w.dataset.who;render();return;}
});
document.addEventListener('keydown',e=>{const m=e.target.closest&&e.target.closest('[data-mod]');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.mod=+m.dataset.mod;render();}});
document.addEventListener('submit',e=>{e.preventDefault();S.screen='inicio';render();window.scrollTo(0,0);});
render();
</script>
