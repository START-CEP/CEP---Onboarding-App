<title>Propuestas App de Pareja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- Demo bar + page tokens ---------- */
:root{
  --page:#E9EAEE; --bar:#FFFFFF; --bar-ink:#1B1D27; --bar-muted:#6A6E7E; --bar-line:#D9DBE3; --bar-on:#1B1D27; --bar-on-ink:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--page:#0B0C10;--bar:#14161C;--bar-ink:#ECEDF2;--bar-muted:#9497A6;--bar-line:#2A2D37;--bar-on:#ECEDF2;--bar-on-ink:#14161C;}
}
:root[data-theme="dark"]{color-scheme:dark;--page:#0B0C10;--bar:#14161C;--bar-ink:#ECEDF2;--bar-muted:#9497A6;--bar-line:#2A2D37;--bar-on:#ECEDF2;--bar-on-ink:#14161C;}

*{box-sizing:border-box}
body{background:var(--page);color:var(--bar-ink);font-family:"Figtree",system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent,#3540E0);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.demobar{position:relative;z-index:50;background:var(--bar);border-bottom:1px solid var(--bar-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.demobar .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--bar-muted);font-weight:600}
.demobar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--bar-line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--bar-muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--bar-on);color:var(--bar-on-ink)}
.demobar .linkbtn{border:1px solid var(--bar-line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.demobar .note{margin-left:auto;font-size:12px;color:var(--bar-muted)}
@media(max-width:860px){.demobar .note{display:none}}

/* ---------- App tokens per proposal ---------- */
.app{
  --bg:#F5F6FA;--surface:#FFFFFF;--surface2:#F0F1F7;--ink:#161A33;--muted:#62678A;--line:#E3E5EF;
  --accent:#3540E0;--accent-ink:#FFFFFF;--accent-soft:#E9EBFD;--hi:#3540E0;
  --ok:#1C8C50;--ok-soft:#E3F4EA;--warn:#B8650F;--warn-soft:#FCEEDC;--crit:#C2364A;--crit-soft:#FBE6E9;
  --side:#FFFFFF;--side-ink:#161A33;--side-muted:#62678A;--side-active:#E9EBFD;--side-active-ink:#3540E0;--side-line:#E3E5EF;
  --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,sans-serif;
  --rad:14px;--rad-s:10px;--shadow:none;
}
.app.pb{
  --bg:#EEF0E8;--surface:#FBFBF7;--surface2:#E5E8DD;--ink:#2B1F2A;--muted:#6B626C;--line:#D8DACD;
  --accent:#6B2E5C;--accent-ink:#FFFFFF;--accent-soft:#F0E3EC;--hi:#D98A4A;
  --ok:#3F7A4E;--ok-soft:#E1ECDD;--warn:#A85A1C;--warn-soft:#F6E6D3;--crit:#A93246;--crit-soft:#F5DFE2;
  --side:#E5E8DD;--side-ink:#2B1F2A;--side-muted:#6B626C;--side-active:#FBFBF7;--side-active-ink:#6B2E5C;--side-line:#D2D5C6;
  --display:"Newsreader",Georgia,serif;--body:"Figtree",system-ui,sans-serif;
  --rad:6px;--rad-s:4px;--shadow:none;
}
.app.pc{
  --bg:#F1F4FA;--surface:#FFFFFF;--surface2:#E8EDF7;--ink:#0E1A3A;--muted:#58658A;--line:#DEE4F0;
  --accent:#0C8F8C;--accent-ink:#FFFFFF;--accent-soft:#DDF3F1;--hi:#E8A21E;
  --ok:#0C8F8C;--ok-soft:#DDF3F1;--warn:#B76A06;--warn-soft:#FCEFD8;--crit:#C23A4E;--crit-soft:#FAE3E7;
  --side:#0E1A3A;--side-ink:#E6ECFA;--side-muted:#8E9AC0;--side-active:#1C2B57;--side-active-ink:#5FE0D4;--side-line:#1F2D57;
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Manrope",system-ui,sans-serif;
  --rad:20px;--rad-s:12px;--shadow:0 1px 2px rgba(14,26,58,.05),0 8px 24px -12px rgba(14,26,58,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .app{color-scheme:dark;--bg:#0D0F1E;--surface:#161931;--surface2:#1E2240;--ink:#ECEEFA;--muted:#9CA1C2;--line:#292D4C;--accent:#7F87FF;--accent-ink:#0D0F1E;--accent-soft:#232859;--hi:#7F87FF;--ok:#5BCB8C;--ok-soft:#173326;--warn:#F0A55A;--warn-soft:#3A2814;--crit:#F27A8B;--crit-soft:#3D1A21;--side:#121428;--side-ink:#ECEEFA;--side-muted:#9CA1C2;--side-active:#232859;--side-active-ink:#AEB3FF;--side-line:#292D4C;}
  :root:not([data-theme="light"]) .app.pb{--bg:#191418;--surface:#221C21;--surface2:#2B242A;--ink:#F1EAEE;--muted:#B5A8B0;--line:#3A3138;--accent:#E3A8D0;--accent-ink:#191418;--accent-soft:#3B2537;--hi:#F0AE74;--ok:#9CCB9E;--ok-soft:#22301F;--warn:#F0B27A;--warn-soft:#3A2A18;--side:#151114;--side-ink:#F1EAEE;--side-muted:#B5A8B0;--side-active:#2B242A;--side-active-ink:#E3A8D0;--side-line:#2E272D;}
  :root:not([data-theme="light"]) .app.pc{--bg:#071027;--surface:#0F1B3B;--surface2:#16244A;--ink:#E8EEFF;--muted:#93A0C6;--line:#21305C;--accent:#43D3C7;--accent-ink:#071027;--accent-soft:#103A44;--hi:#F6C35B;--ok:#43D3C7;--ok-soft:#103A44;--warn:#F6C35B;--warn-soft:#3A2D10;--side:#050C1F;--side-ink:#E6ECFA;--side-muted:#8E9AC0;--side-active:#13224A;--side-active-ink:#5FE0D4;--side-line:#15224A;--shadow:0 8px 24px -12px rgba(0,0,0,.6);}
}
:root[data-theme="dark"] .app{color-scheme:dark;--bg:#0D0F1E;--surface:#161931;--surface2:#1E2240;--ink:#ECEEFA;--muted:#9CA1C2;--line:#292D4C;--accent:#7F87FF;--accent-ink:#0D0F1E;--accent-soft:#232859;--hi:#7F87FF;--ok:#5BCB8C;--ok-soft:#173326;--warn:#F0A55A;--warn-soft:#3A2814;--crit:#F27A8B;--crit-soft:#3D1A21;--side:#121428;--side-ink:#ECEEFA;--side-muted:#9CA1C2;--side-active:#232859;--side-active-ink:#AEB3FF;--side-line:#292D4C;}
:root[data-theme="dark"] .app.pb{--bg:#191418;--surface:#221C21;--surface2:#2B242A;--ink:#F1EAEE;--muted:#B5A8B0;--line:#3A3138;--accent:#E3A8D0;--accent-ink:#191418;--accent-soft:#3B2537;--hi:#F0AE74;--ok:#9CCB9E;--ok-soft:#22301F;--warn:#F0B27A;--warn-soft:#3A2A18;--side:#151114;--side-ink:#F1EAEE;--side-muted:#B5A8B0;--side-active:#2B242A;--side-active-ink:#E3A8D0;--side-line:#2E272D;}
:root[data-theme="dark"] .app.pc{--bg:#071027;--surface:#0F1B3B;--surface2:#16244A;--ink:#E8EEFF;--muted:#93A0C6;--line:#21305C;--accent:#43D3C7;--accent-ink:#071027;--accent-soft:#103A44;--hi:#F6C35B;--ok:#43D3C7;--ok-soft:#103A44;--warn:#F6C35B;--warn-soft:#3A2D10;--side:#050C1F;--side-ink:#E6ECFA;--side-muted:#8E9AC0;--side-active:#13224A;--side-active-ink:#5FE0D4;--side-line:#15224A;--shadow:0 8px 24px -12px rgba(0,0,0,.6);}

/* ---------- Shell ---------- */
.app{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--display);font-weight:700;font-size:19px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--side-muted)}
.navlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-muted);padding:14px 12px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:var(--rad-s);color:var(--side-ink);font-weight:500;font-size:14.5px}
.nav:hover{background:var(--side-active)}
.nav[aria-current="page"]{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px}
.nav .num{width:18px;font-family:var(--display);font-style:italic;color:var(--side-muted);font-size:15px}
.side .spacer{flex:1}
.main{min-width:0;padding:0 32px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.top .crumb{font-size:13px;color:var(--muted)}
.top .crumb b{color:var(--ink);font-weight:600}
.top .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.iconbtn{width:38px;height:38px;border-radius:var(--rad-s);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--crit)}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.who b{display:block;font-size:13.5px}.who span{font-size:12px;color:var(--muted)}
.content{display:flex;flex-direction:column;gap:22px;flex:1}
.bnav{display:none}
.i{flex:none;vertical-align:middle}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:0 16px 104px}
  .top .crumb{display:none}
  .who div{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);border-top:1px solid var(--side-line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav button{border:0;background:transparent;color:var(--side-muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:6px 8px;border-radius:10px}
  .bnav button[aria-current="page"]{color:var(--side-active-ink);background:var(--side-active)}
}

/* ---------- Shared components ---------- */
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,34px);line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.lead{color:var(--muted);font-size:15.5px;max-width:62ch;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--rad-s);font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:7px 12px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.pair{background:transparent;border:1px dashed var(--accent);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn>i{background:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media(max-width:1060px){.grid2,.grid2e{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600}
.li .tx span{font-size:13px;color:var(--muted)}
.ico{width:38px;height:38px;border-radius:var(--rad-s);display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.ico.info{background:var(--accent-soft);color:var(--accent)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--rad-s);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert .i{color:var(--warn);margin-top:2px}
.alert.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.alert.info .i{color:var(--accent)}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:var(--rad);overflow:hidden;background:
  radial-gradient(120% 90% at 20% 20%,color-mix(in srgb,var(--accent) 55%,#fff) 0%,transparent 60%),
  radial-gradient(100% 80% at 85% 90%,color-mix(in srgb,var(--hi) 55%,#000) 0%,transparent 55%),
  color-mix(in srgb,var(--accent) 70%,#0b0b14);display:grid;place-items:center;color:#fff}
.video .play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.video .cap{position:absolute;left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.video .faces{position:absolute;top:16px;left:16px;display:flex}
.video .faces span{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:12px;font-weight:700;margin-right:-8px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--rad-s);padding:11px 13px;font:inherit}
textarea.input{min-height:92px;resize:vertical}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale span{width:36px;height:36px;border-radius:var(--rad-s);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.scale span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.tags span.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:inline-flex;gap:4px;background:var(--surface2);padding:4px;border-radius:calc(var(--rad-s) + 4px);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:var(--rad-s);font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.drop{border:1.5px dashed var(--line);border-radius:var(--rad);padding:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rad-s);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:var(--surface2);color:var(--muted)}
.step.on{border-color:var(--accent);color:var(--accent)}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.ok .n{background:var(--ok-soft);color:var(--ok)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
@media(max-width:1060px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quote{font-family:var(--display);font-size:19px;line-height:1.45;max-width:60ch}
.quote cite{display:block;font-family:var(--body);font-style:normal;font-size:13px;color:var(--muted);margin-top:10px}
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:680px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 10px}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
td b{font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* Pager ("pasar página") */
.pager{margin-top:28px;display:flex;align-items:center;gap:14px;justify-content:space-between;padding:16px 20px;border-radius:var(--rad);background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.pager .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pager .nx b{display:block;font-size:15px}

/* Timeline (A) */
.tl{position:relative;padding:34px 0 26px}
.tl .track{height:10px;border-radius:99px;background:var(--surface2);position:relative}
.tl .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.tl.warn .fill{background:var(--warn)}
.tl .mk{position:absolute;top:50%;width:12px;height:12px;border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);background:var(--surface);border:2px solid var(--accent)}
.tl .mk.done{background:var(--accent)}
.tl .today{position:absolute;top:-30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink)}
.tl .today i{width:2px;height:24px;background:var(--ink)}
.tl .months{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted);font-weight:500}
.tl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* Dashboard A */
.gA{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px}
@media(max-width:1060px){.gA{grid-template-columns:1fr}}
.todo1{display:flex;gap:16px;align-items:center;padding:18px;border-radius:var(--rad-s);background:var(--accent-soft);margin-bottom:6px;flex-wrap:wrap}

function ribbonB(d){

function gantt(d){
  const tpos=`left:calc(${(d.week-.5)/26*100}% - 1px)`;
  const L=lanesData(d);
  const ok=(late,label)=>late?`<span class="chip warn">${label}</span>`:`<span class="chip ok">${ico('check',12)} Al día</span>`;
  const row=(lab,sub,state,cells)=>`<div class="lab">${lab}<span>${sub}</span>${state}</div><div class="gtrack"><span class="t" style="${tpos}"></span>${cells}</div>`;
  const obDone=d.ob.every(x=>x==='done');
  const obCell=`<span class="gm ${obDone?'d':'n'}" style="grid-column:1/3">${obDone?'Listo':'En curso'}</span>`;
  const modCells=d.mods.map((s,i)=>`<span class="gm ${s==='done'?'d':s==='task'?'w':s==='current'?'n':'l'}" style="grid-column:${i+2}" title="Módulo ${i+1}">${i+1}</span>`).join('');
  const grp=Array.from({length:13},(_,i)=>{const w=(i+1)*2;return `<span class="gm dot ${i<d.gDone?'d':i===d.gDone?'n':'l'}" style="grid-column:${w}" title="Coaching grupal ${i+1}"></span>`}).join('');

  let col=1;const months=MONTHS.map(m=>{const x=`<span style="grid-column:${col}/span ${m[1]}">${m[0]}</span>`;col+=m[1];return x}).join('');
  const taskLate=d.mods.includes('task');

  return `<div class="scrollx"><div class="gantt">
    <div></div><div class="gmonths">${months}</div>
    ${row('Bienvenida y radiografía',`${counts(d).obDone} de 6 pasos`,ok(!obDone,'En curso'),obCell)}
    ${row('Psicoeducación',`${counts(d).vids} de 8 módulos · 1 por semana`,ok(taskLate,'1 tarea pendiente'),modCells)}
    ${row('Coaching Grupal',`${d.gDone} de 13 · cada 15 días`,ok(false),grp)}
    ${row('Sesiones de Terapia',`${d.cDone} de 9 sesiones`,nc&&nc.req&&S.phase!=='day1'?`<span class="chip warn">${ico('lock',12)} ${nc.req}</span>`:ok(false),cpl)}

function ring(pct,size=128,label='avance'){
  const r=50,c=2*Math.PI*r;

   <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 60 60)"/>

   <text x="60" y="80" text-anchor="middle" font-size="10" style="font-family:var(--body);font-weight:500;fill:var(--muted)">${label}</text></svg>`;
}
function lanesData(d){
  const c=counts(d);

  return `<div class="ph"><div><p class="eyebrow">${closing?'Cierre del proceso':'Primeros pasos · 5 y 6 de 6'}</p><h1>${closing?'Formulario de cierre':'Radiografía inicial'}</h1><p class="lead">${closing?'Miren cuánto han avanzado desde su radiografía inicial. Esta parte la responden juntos.':'No es un diagnóstico: es una foto de su punto de partida. Nos ayuda a adaptar todo el proceso a ustedes.'}</p></div>${done?`<span class="chip ok">${ico('check',14)} Enviada el 5 sep</span>`:`<span class="chip warn">Les toma unos 25 min</span>`}</div>
  <div class="steps">${secs.map((s,i)=>`<span class="step ${i===2?'on':(done||i<2)&&S.phase!=='day1'?'ok':''}"><span class="n">${(done||i<2)&&S.phase!=='day1'&&i!==2?'✓':i+1}</span>${s[0]} <span class="chip ${s[1]==='En pareja'?'pair':''}" style="padding:1px 8px">${s[1]}</span></span>`).join('')}</div>
  <div class="grid2">
    <section class="card qblock">
      <div class="ch" style="margin:0"><h2>3 · Lo que les trae aquí</h2><span class="chip pair">${ico('users',14)} Respóndanla juntos</span></div>
      <div class="field"><label for="q1">¿Qué les gustaría que fuera distinto dentro de 6 meses?</label>
        <textarea class="input" id="q1">Poder hablar de decisiones de trabajo sin terminar discutiendo. Que Andrea sienta que la escucho y que Pedro sienta que lo entiendo.</textarea></div>
      <div class="field"><label>Hoy, ¿qué tan conectados se sienten? <span class="muted">(1 = nada · 10 = mucho)</span></label>
        <div class="scale">${Array.from({length:10},(_,i)=>`<span class="${i===4?'on':''}">${i+1}</span>`).join('')}</div></div>
      <div class="field"><label>¿En qué temas quieren trabajar?</label>
        <div class="tags">${['Comunicación','Acuerdos','Trabajo y pareja','Valoración','Intimidad','Familia','Dinero'].map((t,i)=>`<span class="${[0,1,2,3].includes(i)?'on':''}">${t}</span>`).join('')}</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn">Enviar sección</button><button class="btn ghost">Guardar borrador</button></div>
    </section>

      <div class="alert info">${ico('users')}<div><b>Sección en pareja.</b> ${w.other} recibió el mismo enlace por email. Lo que envíen queda en la ficha de los dos.</div></div>

      <section class="card"><h3 style="margin-bottom:10px">¿Para qué la usamos?</h3><p class="muted">Su terapeuta la lee antes de la primera sesión para llegar con contexto y definir con ustedes los objetivos del proceso.</p></section>

}
function modulos(){
  const d=D(),w=W();
  let f=S.mod;if(f===null||f===undefined){f=d.mods.findIndex(x=>x==='task');if(f<0)f=d.mods.findIndex(x=>x==='current');if(f<0)f=0;}
  const st=d.mods[f];
  const icon=s=>s==='done'?`<span class="ico ok">${ico('check')}</span>`:s==='task'?`<span class="ico warn">${ico('pen')}</span>`:s==='current'?`<span class="ico info">${ico('play')}</span>`:`<span class="ico">${ico('lock')}</span>`;
  const lbl=s=>s==='done'?'Visto · tarea entregada':s==='task'?'Visto · falta la tarea':s==='current'?'Disponible':'Se abre al completar el anterior';
  const ans=S.who==='pedro'?'Sentí que no me estaba escuchando y quise cerrar el tema rápido, con datos. Ella lo vivió como que no me importaba.':'Sentí que otra vez no valoraba mi idea. Respondí antes de pensarlo y después me arrepentí de cómo lo dije.';
  const req=f===4&&S.phase==='mid'?`<div class="alert">${ico('info')}<div><b>Esta tarea es necesaria para su sesión del 22 oct.</b> Si no la han terminado, les enviaremos un recordatorio 48 horas antes.</div></div>`:f===7&&S.phase==='end'?`<div class="alert">${ico('info')}<div><b>La revisaremos en su sesión del 9 feb.</b></div></div>`:'';
  const task=st==='locked'?`<div class="alert info">${ico('lock')}<div>Este módulo se abre cuando terminen el anterior. Pueden ir más rápido si quieren, pero mínimo uno por semana.</div></div>`:`
    <div class="ch" style="margin:0"><h2>Tarea del módulo</h2><div class="tabs"><button data-tab="online" aria-pressed="${S.taskTab==='online'}">Completar en línea</button><button data-tab="pdf" aria-pressed="${S.taskTab==='pdf'}">Descargar PDF y subir</button></div></div>
    ${req}
    ${S.taskTab==='online'?`
    <div class="field"><label for="t1">1. Piensa en su última discusión. ¿Qué sentiste justo antes de responder?</label><span class="hint">Individual · solo lo lee el equipo</span><textarea class="input" id="t1">${ans}</textarea></div>
    <div class="field"><label>2. ¿Qué tan rápido notas que te estás alterando? <span class="muted">(1 = tarde · 5 = enseguida)</span></label><div class="scale">${[1,2,3,4,5].map(n=>`<span class="${n===(S.who==='pedro'?3:2)?'on':''}">${n}</span>`).join('')}</div></div>
    <div class="field"><label for="t3">3. Acuerden una señal de pausa que los dos respeten</label><span class="chip pair" style="align-self:flex-start">${ico('users',13)} En pareja · les llega por email a los dos</span><textarea class="input" id="t3" placeholder="Escríbanla juntos…"></textarea></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn">${ico('check',16)} Entregar tarea</button><button class="btn ghost">Guardar borrador</button></div>`
    :`<div class="drop">${ico('upload',26)}<b style="color:var(--ink)">Arrastren aquí su tarea completada</b><span class="small">PDF, foto o escaneo · hasta 20 MB</span><button class="btn ghost sm">Elegir archivo</button></div>
    <button class="btn soft" style="align-self:flex-start">${ico('dl',16)} Descargar la tarea en PDF</button>
    <p class="small muted">¿Les gusta escribir a mano? Descarguen, completen y suban la foto. Recomendamos la versión en línea: así su terapeuta la tiene lista antes de la sesión.</p>`}`;
  return `<div class="ph"><div><p class="eyebrow">Psicoeducación</p><h1>Módulos</h1><p class="lead">Mínimo un módulo por semana: así tienen tiempo de pensarlo. Si quieren ver dos o tres seguidos, también está bien.</p></div><span class="chip info">${d.mods.filter(x=>x==='done'||x==='task').length} de 8 vistos</span></div>
  <div class="split">
    <section class="card"><div class="list modlist">${MODS.map((m,i)=>`<div class="li ${i===f?'on':''}" data-mod="${i}" role="button" tabindex="0">${icon(d.mods[i])}<div class="tx"><b>${i+1}. ${m}</b><span>${lbl(d.mods[i])}</span></div></div>`).join('')}</div></section>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <div class="video" role="img" aria-label="Video del módulo ${f+1}"><span class="play">${st==='locked'?ico('lock',24):ico('play',26)}</span><div class="cap"><span>Módulo ${f+1} · ${MODS[f]}</span><span>${MODMIN[f]} min</span></div></div>
      <section class="card qblock">${task}</section>
    </div>
  </div>
  ${pager()}`;
}

    ${c.agenda?`<span class="small" style="font-weight:600;margin-top:4px">Qué veremos</span><ul class="agendaitems">${c.agenda.map(a=>`<li>${a}</li>`).join('')}</ul>`:''}

function coaching(){
  const d=D();
  return `<div class="ph"><div><p class="eyebrow">Coaching Grupal</p><h1>Coaching Grupal</h1><p class="lead">Cada 15 días, en línea, con otras parejas del programa. Pueden dejar sus preguntas antes para que las trabajemos en la sesión.</p></div><span class="chip info">${d.gDone} de 13 hechas</span></div>

      <button class="btn" style="align-self:flex-start">Enviar pregunta</button></section>

function progreso(){
  const d=D(),c=counts(d);
  const hist=[];
  d.mods.forEach((s,i)=>{if(s==='done')hist.push(['pen',`Tarea del Módulo ${i+1}`,'Entregada en línea','ok']);if(s==='task')hist.push(['play',`Módulo ${i+1} · video visto`,'Falta entregar la tarea','warn'])});
  if(d.ob[5]==='done')hist.push(['pulse','Radiografía inicial','Enviada el 5 sep · individual y en pareja','ok']);
  if(d.ob[1]==='done')hist.push(['file','Contrato firmado','2 sep 2026','ok']);
  hist.reverse();
  return `<div class="ph"><div><p class="eyebrow">Mi progreso</p><h1>Lo que ya hicieron</h1><p class="lead">Todo lo que van completando queda aquí para volver a verlo cuando quieran.</p></div>${statusChip(d)}</div>
  <section class="card"><div class="stats">
    <div class="stat"><b>${c.obDone}/6</b><span>Primeros pasos</span></div>
    <div class="stat"><b>${c.vids}/8</b><span>Módulos vistos</span></div>
    <div class="stat"><b>${c.tasks}/8</b><span>Tareas entregadas</span></div>
    <div class="stat"><b>${d.gDone}/13</b><span>Coaching Grupal</span></div>
    <div class="stat"><b>${d.cDone}/9</b><span>Sesiones de Terapia</span></div>
  </div></section>
  <section class="card"><div class="ch"><h2>Historial</h2><span class="muted small">Lo más reciente primero</span></div>
    ${hist.length?`<div class="list">${hist.map(h=>`<div class="li"><span class="ico ${h[3]}">${ico(h[0])}</span><div class="tx"><b>${h[1]}</b><span>${h[2]}</span></div>${h[3]==='ok'?`<button class="btn ghost sm">Ver</button>`:`<button class="btn sm" ${go('modulos')}>Completar</button>`}</div>`).join('')}</div>`:`<p class="muted">Todavía no hay nada aquí. Su primer paso: ver el video de bienvenida.</p>`}
  </section>
  ${pager()}`;
}
function equipo(){
  const rows=[['Pedro y Andrea','Pareja · 6 meses','Semana 7','45%','Tarea M5 pendiente','22 oct','warn'],['Laura y Tomás','Pareja · 6 meses','Semana 15','61%','Al día','24 oct','ok'],['Carmen y Raúl','Pareja · 6 meses','Semana 2','7%','Radiografía en pareja sin enviar','28 oct','warn'],['Mónica V.','Individual · 2 meses','Semana 6','70%','Al día','23 oct','ok'],['Sofía y Martín','Intensivo · 3 días','14–16 nov','—','Contrato sin firmar','14 nov','crit']];

  <section class="card"><div class="ch"><h2>Procesos activos</h2></div><div class="scrollx"><table>
    <thead><tr><th>Cliente</th><th>Servicio</th><th>Momento</th><th>Avance</th><th>Estado</th><th>Próxima sesión</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td><span class="chip ${r[6]}">${r[4]}</span></td><td class="num">${r[5]}</td></tr>`).join('')}</tbody></table></div></section>
  <div class="grid2e">

      <div class="li"><span class="ico warn">${ico('bell')}</span><div class="tx"><b>Pedro y Andrea · tarea del Módulo 5</b><span>Recordatorio automático enviado hoy 9:00 · esperando su clic en «Ya la completamos»</span></div></div>

      <div class="li"><span class="ico warn">${ico('pen')}</span><div class="tx"><b>Sofía y Martín · contrato</b><span>Llamar hoy · el intensivo empieza en un mes</span></div></div>
    </div></section>
    <section class="card"><div class="ch"><h2>Informe pre-sesión</h2><span class="muted small">Pedro y Andrea · sesión 3 · 22 oct</span></div><div class="list">
      <div class="li"><div class="tx"><b>Objetivos (sesión 1)</b><span>Decidir temas de trabajo sin discutir · que Andrea se sienta valorada · que Pedro se sienta entendido</span></div></div>

function login(){
  const w=W();

    :`<div><p class="eyebrow" style="color:inherit;opacity:.8">CEP · Terapia de pareja</p><h2>Aquí hay orden, claridad y un siguiente paso.</h2></div><p>Cada uno entra con su propio acceso. Es su espacio personal dentro del proceso de pareja.</p>`;

/* ---------- render ---------- */
const SCREENS={inicio:()=>S.p==='a'?dashA():S.p==='b'?dashB():dashC(),bienvenida,contrato,radiografia,modulos,terapia,coaching,progreso,equipo};
const root=document.getElementById('root');
function render(){
  if(!SCREENS[S.screen]&&S.screen!=='login')S.screen='inicio';
  root.innerHTML=S.screen==='login'?login():shell(SCREENS[S.screen]());
  for(const [id,key] of [['segP','p'],['segPh','phase'],['segW','who']])
    document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S[key]));
  save();
}
document.addEventListener('click',e=>{
  const seg=e.target.closest('.seg button');
  if(seg){const k={segP:'p',segPh:'phase',segW:'who'}[seg.parentElement.id];S[k]=seg.dataset.v;S.mod=null;render();return;}
  if(e.target.closest('#toLogin')){S.screen='login';render();window.scrollTo(0,0);return;}
  if(e.target.closest('#toTeam')){S.screen='equipo';render();window.scrollTo(0,0);return;}
  const g=e.target.closest('[data-go]');
  if(g){S.screen=g.dataset.go;S.mod=null;render();window.scrollTo(0,0);return;}
  const m=e.target.closest('[data-mod]');
  if(m){S.mod=+m.dataset.mod;render();return;}
  const t=e.target.closest('[data-tab]');
  if(t){S.taskTab=t.dataset.tab;render();return;}
  const w=e.target.closest('[data-who]');
  if(w){S.who=w.dataset.who;render();return;}
});
document.addEventListener('keydown',e=>{const m=e.target.closest&&e.target.closest('[data-mod]');if(m&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.mod=+m.dataset.mod;render();}});
document.addEventListener('submit',e=>{e.preventDefault();S.screen='inicio';render();window.scrollTo(0,0);});
render();
</script>
